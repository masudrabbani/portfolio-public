name: Publish audited public preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - static-public.zip
      - public-manifest.json
      - verify_public_site.py
      - .github/workflows/pages.yml

# No personal access token, Cloudflare credential, or repository write grant.
permissions: {}

concurrency:
  group: portfolio-public-pages
  cancel-in-progress: false

jobs:
  verify-and-upload:
    if: github.repository == 'masudrabbani/portfolio-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Read this public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Verify public-only archive before extraction
        run: python3 -I verify_public_site.py
      - name: Upload only the verified website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1
          include-hidden-files: false

  deploy:
    if: github.repository == 'masudrabbani/portfolio-public' && github.ref == 'refs/heads/main'
    needs: verify-and-upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This privileged job does not check out or execute repository scripts.
      - name: Publish the verified preview artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
